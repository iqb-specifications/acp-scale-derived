name: Notify Main Doc to rerender

on:
  push:
    branches:
      - main
      - develop
jobs:
  notify-parent:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger iqb-specifications.github.io to rebuild
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.SPECIFICATIONS_JSON_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/iqb-specifications/iqb-specifications.github.io/dispatches \
            -d '{"event_type": "spec-updated", "client_payload": {"repo": "${{ github.event.repository.name }}"}}'
